<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Must match the color-scheme the overlay gives the page, or the browser paints an opaque canvas. -->
<meta name="color-scheme" content="light dark">
<!-- No <title> here: the page sets one once its input has the focus, and the host reads that title as "ready". -->
<link rel="stylesheet" href="cmdline.css">
</head>
<body>
<div class="desertfox-cmdline">
  <div id="list" class="desertfox-cmdline-list" role="listbox" hidden></div>
  <div id="note" class="desertfox-cmdline-note" hidden></div>
  <div class="desertfox-cmdline-row">
    <span id="prompt" class="desertfox-cmdline-prompt">&gt; </span>
    <input id="input" class="desertfox-cmdline-input" type="text" spellcheck="false" autocomplete="off" autofocus>
    <span id="status" class="desertfox-cmdline-status" hidden></span>
  </div>
</div>
<script src="cmdline.js"></script>
</body>
</html>
